name: Release

# Signed + notarized build for tags v*. Requires repository secrets:
#   MACOS_CERT_P12        base64 of the "Developer ID Application" certificate (.p12)
#   MACOS_CERT_PASSWORD   password of that .p12
#   DEVELOPER_ID_APP      identity name, e.g. "Developer ID Application: Jane Doe (TEAMID1234)"
#   NOTARY_KEY_P8         base64 of an App Store Connect API key (AuthKey_XXXX.p8)
#   NOTARY_KEY_ID         its key id
#   NOTARY_ISSUER         its issuer id

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos-release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Import signing certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - name: Store notarization credentials
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          echo "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool store-credentials dumble-notary \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER"
          rm "$RUNNER_TEMP/AuthKey.p8"

      - name: Build
        run: |
          cmake -B build -G Xcode -DDUMBLE_BUILD_TESTS=OFF
          cmake --build build --config Release -- -quiet

      - name: Sign, notarize, staple
        env:
          DEVELOPER_ID_APP: ${{ secrets.DEVELOPER_ID_APP }}
          NOTARY_PROFILE: dumble-notary
        run: |
          ./scripts/sign_and_notarize.sh
          TARGET=VoxAC30C2 PRODUCT=AC30C2 ./scripts/sign_and_notarize.sh

      - uses: actions/upload-artifact@v4
        with:
          name: plugins-dmg
          path: dist/*.dmg

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.dmg --title "${GITHUB_REF_NAME}" --generate-notes
